database: /var/lib/diskmon/diskmon.duckdb

collector:
  interval: 60s
  drives: []
  tests:
    short: ""
    long: ""

web:
  # Packaged default is intentionally local-only.
  # To expose the UI on a LAN or public interface, explicitly opt in with
  # `0.0.0.0:8976` (or another non-loopback address) and add external network
  # controls such as a firewall, reverse proxy, or other access restrictions.
  listen: 127.0.0.1:8976

log:
  level: INFO

