version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    target-branch: main
updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies

  - package-ecosystem: bun
    directory: /webui
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies
