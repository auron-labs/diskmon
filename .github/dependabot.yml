version: 2
updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    target-branch: main
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      gomod-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webui
    target-branch: main
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
