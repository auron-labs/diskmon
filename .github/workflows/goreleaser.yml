name: goreleaser

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v0.2.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    # Pin to 22.04 so CGO-linked Linux binaries target an older glibc baseline.
    runs-on: ubuntu-22.04

    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        id: validate_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$INPUT_TAG" in
            v*) ;;
            *)
              echo "workflow_dispatch tag must start with 'v'" >&2
              exit 1
              ;;
          esac

          RELEASE_REF="refs/tags/$INPUT_TAG"
          git ls-remote --exit-code --refs "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "$RELEASE_REF" >/dev/null
          echo "ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.validate_tag.outputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install WebUI dependencies
        run: bun install --cwd webui --frozen-lockfile

      - name: Audit WebUI dependencies
        run: bun audit --cwd webui

      - name: Install Linux cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ github.repository }}
